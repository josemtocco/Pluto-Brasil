name: Atualizar Pluto TV Brasil

on:
  workflow_dispatch:
  schedule:
    # Atualiza a lista a cada 6 horas
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar dependências
        run: python -m pip install --upgrade requests

      - name: Gerar playlist Pluto TV
        run: python gerar_lista.py

      - name: Converter para links curtos do Worker
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          arquivo = Path("pluto-brasil.m3u")
          texto = arquivo.read_text(encoding="utf-8")

          worker = "https://pluto-ssiptv.josevanit.workers.dev/c/"

          linhas = texto.splitlines()
          saida = []

          for linha in linhas:
              if linha.startswith("http"):
                  match = re.search(r"/channel/([A-Za-z0-9]+)/master\.m3u8", linha)

                  if match:
                      channel_id = match.group(1)
                      linha = worker + channel_id

              saida.append(linha)

          arquivo.write_text(
              "\n".join(saida) + "\n",
              encoding="utf-8"
          )

          print("Playlist convertida para links curtos do Worker.")

          PY

      - name: Publicar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pluto-brasil.m3u
          git diff --cached --quiet || git commit -m "Atualiza playlist Pluto TV Brasil"
          git push
